name: CD DevSecBackend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests --file ./pom.xml

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }}

  deploy-staging:
    name: Deploy to Preproduction
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: unnecessary

      - name: Add EC2 to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Deploy backend on EC2 (staging)
        run: |
          ssh ec2-user@${{ secrets.EC2_PUBLIC_IP }} << EOF
            set -euo pipefail
            export POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }}
            docker stop backend_preprod || true
            docker rm backend_preprod || true
            docker run -d --name backend_preprod --network bdd_nginx_app-network -p 8082:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kgpc \
              -e SPRING_DATASOURCE_USERNAME=postgres \
              -e SPRING_DATASOURCE_PASSWORD="${POSTGRES_PASSWORD}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }}
          EOF
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  run-dast:
    name: Run DAST on Preproduction
    runs-on: self-hosted
    needs: deploy-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Run DAST with ZAP
        shell: cmd
        run: dast.bat "%GITHUB_WORKSPACE%"
        env:
          ZAP_URL: http://${{ secrets.EC2_PUBLIC_IP }}:8082
      - name: Fail on High/Medium alerts
        shell: pwsh
        run: |
          if (!(Test-Path "report.json")) { Write-Error "report.json not found"; exit 1 }
          $json = Get-Content -Raw -Path "report.json" | ConvertFrom-Json
          $alerts = @()
          foreach ($site in $json.site) { $alerts += $site.alerts }
          $high   = ($alerts | Where-Object { $_.riskdesc -like "High*" }).Count
          $medium = ($alerts | Where-Object { $_.riskdesc -like "Medium*" }).Count
          Write-Host "ZAP alerts => High: $high, Medium: $medium"
          if ($high -gt 0 -or $medium -gt 0) { throw "Failing pipeline: High=$high Medium=$medium" }
      - name: Upload DAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: |
            report.html
            report.json

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: run-dast
    if: needs.run-dast.result == 'success'  

    steps:
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: unnecessary

      - name: Add EC2 prod to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Clean up Production
        run: |
          ssh ec2-user@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            docker stop backend_preprod || true
            docker rm backend_preprod || true
          EOF

      - name: Deploy backend on EC2 (production)
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 ec2-user@${{ secrets.EC2_PUBLIC_IP }} << EOF
            set -euo pipefail
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }}
            docker stop backend_prod || true
            docker rm backend_prod || true
            docker run -d --name backend_prod --network bdd_nginx_app-network -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kgpc \
              -e SPRING_DATASOURCE_USERNAME=postgres \
              -e SPRING_DATASOURCE_PASSWORD="${POSTGRES_PASSWORD}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/deploy-backend:${{ github.sha }}
          EOF
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}