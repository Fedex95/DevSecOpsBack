---
env:
  contexts:
    - name: "Default Context"
      urls:
        - "http://TU_IP_EC2:8082"   
      includePaths:
        - ".*"
  parameters:
    failOnError: false
    progressToStdout: true
jobs:
  - type: openapi
    parameters:
      apiUrl: "OPENAPI_URL"        
  - type: spider
    parameters:
      context: "Default Context"
      maxDuration: 10
  - type: passiveScan-config
    parameters: {}
  - type: passiveScan-wait
    parameters: {}
  - type: activeScan
    parameters:
      context: "Default Context"
      maxRuleDurationInMins: 5
  - type: report
    parameters:
      template: traditional-html
      reportDir: ""
      reportFile: report
      reportTitle: ZAP DAST Report