---
env:
  contexts:
    - name: "Default Context"
      urls:
        - "FULL_URL"                      
      includePaths:
        - "^FULL_URL/.*"                   
      excludePaths:
        - "^https?://(?!HOSTPORT).*"       
  parameters:
    failOnError: false                    
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: openapi
    parameters:
      apiUrl: "OPENAPI_URL"
      context: "Default Context"

  - type: spider
    parameters:
      context: "Default Context"
      maxDuration: 8
      maxChildren: 300

  - type: passiveScan-config
    parameters: {}

  - type: passiveScan-wait
    parameters: {}

  - type: activeScan-config
    parameters:
      threadPerHost: 5
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 20
      handleAntiCSRFTokens: true
      injectPluginIdInHeader: true
    rules:
      - id: 40018   # SQL Injection
        attackStrength: High
        alertThreshold: Low
      - id: 90020   # SQL Injection - Time Based
        attackStrength: Medium
        alertThreshold: Low
      - id: 40012   # XSS (Reflected)
        attackStrength: High
        alertThreshold: Low
      - id: 40014   # XSS (Stored)
        attackStrength: High
        alertThreshold: Low

  - type: activeScan
    parameters:
      context: "Default Context"
      threadPerHost: 5
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 20

  - type: report
    parameters:
      template: traditional-html
      reportDir: 'REPORT_DIR'            
      reportFile: report
      reportTitle: "ZAP DAST Report"

  - type: report
    parameters:
      template: traditional-json
      reportDir: 'REPORT_DIR'
      reportFile: report
      reportTitle: "ZAP DAST Report"